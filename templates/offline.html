{% extends "layout.html" %}

{% block title %}Offline{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-wifi-off display-1 text-muted"></i>
    <h1 class="mt-3">You are offline</h1>
    <p class="lead">Please check your internet connection and try again.</p>
    <button onclick="location.reload()" class="btn btn-success">Retry</button>
</div>
{% endblock %}
